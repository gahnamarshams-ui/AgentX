name: Cross-platform execution safety
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend test dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Backend policy and native filesystem regressions
        working-directory: backend
        env:
          EXECUTION_ENABLED: 'false'
          PYTHON_EXECUTION_ENABLED: 'false'
        run: python -m pytest -q --basetemp=.pytest-ci
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Frontend tests
        working-directory: frontend
        run: npm test
      - name: TypeScript and build
        working-directory: frontend
        run: npm run build
